name: Temporary finalize v1.8.5 branch

on:
  push:
    branches: [main]
    paths: ['.github/workflows/temporary-finalize-v1.8.5.yml']

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.8.5-version-and-dashboard
          fetch-depth: 0
      - name: Align version and validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('worker/src/index.js')
          s=p.read_text()
          if 'version:"1.8.4"' not in s and 'version:"1.8.5"' not in s:
              raise SystemExit('Worker version string not found')
          p.write_text(s.replace('version:"1.8.4"','version:"1.8.5"',1))
          PY
          node --check worker/src/index.js
          node --check frontend/game.js
          node --check frontend/admin.js
          node --check frontend/admin-dashboard.js
          node scripts/check-worker.mjs
      - name: Commit branch update
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker/src/index.js
          git commit -m 'fix(version): align Worker health endpoint with v1.8.5'
          git push origin HEAD:v1.8.5-version-and-dashboard
