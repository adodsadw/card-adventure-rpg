name: Finalize v1.8.5

on:
  push:
    branches:
      - v1.8.5-version-and-dashboard
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: v1.8.5-version-and-dashboard
          fetch-depth: 0

      - name: Patch Worker version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('worker/src/index.js')
          text = path.read_text()
          old = 'version:"1.8.4"'
          new = 'version:"1.8.5"'
          if old not in text and new not in text:
              raise SystemExit('Cannot find Worker health version string')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Validate JavaScript
        run: |
          node --check worker/src/index.js
          node --check frontend/game.js
          node --check frontend/admin.js
          node --check frontend/admin-dashboard.js
          node scripts/check-worker.mjs

      - name: Commit finalized version
        run: |
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker/src/index.js
          git commit -m 'fix(version): align Worker health endpoint with v1.8.5'
          git push origin HEAD:v1.8.5-version-and-dashboard
