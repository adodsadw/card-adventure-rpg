<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星界遠征管理後台 v1.8.2</title><link rel="stylesheet" href="./styles.css"><style>
.admin-wrap{max-width:1100px;margin:auto;padding:24px}.admin-panel{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:20px;margin:18px 0}.admin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.admin-grid input,.admin-grid textarea{width:100%;box-sizing:border-box;background:#0d1022;border:1px solid var(--border);color:white;border-radius:12px;padding:12px}.player-table{width:100%;border-collapse:collapse}.player-table td,.player-table th{padding:10px;border-bottom:1px solid var(--border);text-align:left}.scroll{overflow:auto}</style></head><body><div class="admin-wrap">
<div class="eyebrow">ADMIN CONSOLE</div><h1>星界遠征管理後台 v1.8.2</h1>
<section id="loginPanel" class="admin-panel"><h2>管理員登入</h2><div class="admin-grid"><input id="adminPassword" type="password" placeholder="ADMIN_PASSWORD"><button class="primary" id="adminLogin">登入</button></div></section>
<div id="adminApp" class="hidden"><div class="gm-tabs" id="gmTabs"><button class="secondary active" data-gm-tab="players">玩家</button><button class="secondary" data-gm-tab="heroes">英雄</button><button class="secondary" data-gm-tab="skills">技能</button><button class="secondary" data-gm-tab="equipment">裝備</button><button class="secondary" data-gm-tab="items">道具</button><button class="secondary" data-gm-tab="shop">商城</button><button class="secondary" data-gm-tab="dungeons">副本</button><button class="secondary" data-gm-tab="events">活動</button><button class="secondary" data-gm-tab="loginRewards">登入獎勵</button><button class="secondary" data-gm-tab="announcements">公告</button><button class="secondary" data-gm-tab="banners">Banner</button></div><section id="gmWorkspace" class="admin-panel hidden"></section><div id="legacyAdminPanels">
<section class="admin-panel"><div style="display:flex;justify-content:space-between"><h2>玩家列表</h2><div style="display:flex;gap:8px"><button class="secondary" id="refreshPlayers">重新整理</button><button class="danger-button" id="adminLogout">登出</button></div></div><div class="scroll"><table class="player-table"><thead><tr><th>玩家</th><th>金幣</th><th>鑽石</th><th>體力</th><th>關卡</th><th>狀態</th><th>操作</th></tr></thead><tbody id="playerRows"></tbody></table></div></section>
<section class="admin-panel"><h2>玩家充值／扣除</h2><div class="admin-grid"><input id="targetPlayer" placeholder="玩家 ID（可手動輸入，或由玩家列表選擇）" autocomplete="off" spellcheck="false"><input id="deltaGold" type="number" placeholder="金幣增減"><input id="deltaGems" type="number" placeholder="鑽石增減"><input id="deltaEnergy" type="number" placeholder="體力增減"><input id="adjustReason" placeholder="原因，例如：客服補償"><button class="primary" id="submitAdjust">送出調整</button></div></section>
<section class="admin-panel"><h2>寄送營運信件</h2><div class="admin-grid"><input id="mailTarget" placeholder="玩家 ID；留空代表全部玩家"><input id="mailTitle" placeholder="信件標題"><textarea id="mailBody" placeholder="信件內容"></textarea><input id="mailGold" type="number" placeholder="金幣"><input id="mailGems" type="number" placeholder="鑽石"><input id="mailEnergy" type="number" placeholder="體力"><button class="primary" id="sendMail">寄送信件</button></div></section>
<section class="admin-panel"><h2>停權管理</h2>
<div class="admin-grid">
<input id="suspendPlayer" placeholder="玩家 ID" readonly>
<input id="suspendUntil" type="datetime-local">
<input id="suspendReason" placeholder="停權原因">
<button class="primary" id="submitSuspend">停權玩家</button>
<button class="secondary" id="submitUnsuspend">解除停權</button>
</div></section>
<section class="admin-panel"><h2>刪除玩家帳戶</h2>
<div class="admin-grid">
<input id="deletePlayer" placeholder="玩家 ID" readonly>
<input id="deleteReason" placeholder="刪除原因">
<input id="deleteConfirm" placeholder="輸入 DELETE 確認">
<button class="admin-danger" id="submitDelete">永久刪除玩家資料</button>
</div>
<p class="server-note">此操作會刪除玩家、英雄、存檔、信箱、戰鬥紀錄與 Session。玩家日後再次使用 LINE 登入時會建立全新帳號。</p>
</section>
<section class="admin-panel"><h2>最近管理紀錄</h2><div id="adminLogs"></div></section>
</div></div><div id="adminToast" class="toast"></div></div><script src="./admin.js"></script></body></html>
